# ==============================================================================
# hakeem-games.novixa.dev — site block for mailcow's nginx on the Novixa VPS.
#
# Static site (no container). Installed by deploy/deploy.sh to
# /opt/mailcow-dockerized/data/conf/nginx/hakim-games.conf; the script runs
# `nginx -t` and restores the previous file if the test fails, so a bad edit
# can never take down mailcow's nginx (webmail, novixa.dev, ...).
# Edit it in the repository, not on the server.
#
# It only answers for hakeem-games.novixa.dev; every other host is untouched.
# ==============================================================================

server {
    listen 80;
    server_name hakeem-games.novixa.dev;
    return 301 https://hakeem-games.novixa.dev$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name hakeem-games.novixa.dev;

    # Cloudflare Origin Certificate (*.novixa.dev) — this site's own copy.
    ssl_certificate     /etc/nginx/conf.d/hakim-games/origin.pem;
    ssl_certificate_key /etc/nginx/conf.d/hakim-games/origin.key;

    # `current` is a relative symlink to releases/<release>, swapped per deploy.
    root /etc/nginx/conf.d/hakim-games/current;
    index index.html;

    # Locations below use `expires` (not add_header) so these stay inherited.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/ttf application/x-font-ttf;

    location /icons/ { expires 7d;  try_files $uri =404; }
    location /fonts/ { expires 30d; try_files $uri =404; }

    location = /index.html { expires -1; }

    # Repo files that are not part of the site are never published, but be explicit.
    location ~ /\. { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /index.html;
}
